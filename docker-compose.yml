version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=youremail@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./acme.json:/acme.json"
    restart: unless-stopped

  vorfahrt:
    build: .
    environment:
      # Primary server hostname for SMTP EHLO/HELO and rDNS (PTR) validation
      - SMTP_DOMAIN=mail.example.com
      # SMTP listen address (port 25)
      - SMTP_ADDR=:25
      # Path to mounted acme.json for TLS certs and sender domain validation
      - ACME_FILE=/data/acme.json
      # Storage directory for SQLite database (data.db) and keys
      - DATA_DIR=/data
      # DKIM key configuration (auto-generated if missing)
      - DKIM_KEY_FILE=/data/dkim.key
      - DKIM_SELECTOR=mail
      # Web UI credentials and address
      - WEB_ADDR=:8080
      - WEB_USERNAME=admin
      - WEB_PASSWORD=secret
      # Set to true if exposing port 465 for Implicit TLS (SMTPS). Defaults to false (STARTTLS).
      # - SMTP_IMPLICIT_TLS=false
    ports:
      - "25:25"      # Expose SMTP publicly to receive inbound mail from clients/servers
      - "8080:8080"  # Web UI port (optional if routed through Traefik)
    volumes:
      # Share acme.json from Traefik
      - "./acme.json:/data/acme.json:ro"
      # Persist SQLite DB and DKIM key
      - "./data:/data"
    labels:
      - "traefik.enable=true"
      # Route external traffic to the UI via Traefik (optional)
      - "traefik.http.routers.vorfahrt.rule=Host(`mail.example.com`)"
      - "traefik.http.routers.vorfahrt.entrypoints=websecure"
      - "traefik.http.routers.vorfahrt.tls.certresolver=myresolver"
      - "traefik.http.services.vorfahrt.loadbalancer.server.port=8080"
    restart: unless-stopped
